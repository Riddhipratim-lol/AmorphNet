[project]
name = "amorphnet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.3.0",
    "fastapi>=0.142.2",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-voyageai>=0.4.1",
    "langgraph>=1.2.12",
    "llama-cloud-services>=0.6.94",
    "neo4j>=6.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "ragas>=0.4.3",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "tenacity>=9.1.4",
    "upstash-redis>=1.8.0",
    "uvicorn>=0.54.0",
    "voyageai>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits real cloud services; only runs when RUN_LIVE_TESTS=1 and credentials exist",
]
